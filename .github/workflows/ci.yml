name: Crawler CI

on:
  push:
    branches: [main]
    paths:
      - "drop_hunter/**"
      - "tests/**"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
      - ".github/workflows/crawl-sites.yml"
      - ".github/workflows/crawler-benchmark.yml"
  pull_request:
    paths:
      - "drop_hunter/**"
      - "tests/**"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/crawl-sites.yml"
      - ".github/workflows/crawler-benchmark.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
