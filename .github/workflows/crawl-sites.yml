name: Crawl sites

on:
  workflow_dispatch:
    inputs:
      domains:
        description: "Domains/URLs separated by new lines, spaces, commas or semicolons"
        required: true
        type: string
      max_pages:
        description: "Maximum pages per site (0 = unlimited until runtime safety limit)"
        required: false
        default: "0"
        type: string
      max_runtime_minutes:
        description: "Maximum runtime per site before saving a resumable checkpoint"
        required: false
        default: "270"
        type: string
      full_page_scan:
        description: "Scroll every page to trigger lazy/virtual content (slower)"
        required: false
        default: false
        type: boolean
      write_raw_links_to_sheets:
        description: "Also append every link-level row to Google Sheets (can become huge)"
        required: false
        default: false
        type: boolean
      max_parallel:
        description: "Maximum number of site jobs to run at once"
        required: false
        default: "2"
        type: string
      resume_run_id:
        description: "Optional previous workflow run ID to restore checkpoints from"
        required: false
        default: ""
        type: string
      auto_resume:
        description: "Automatically start another checkpointed run until the site queue is empty"
        required: false
        default: true
        type: boolean
      continuation_index:
        description: "Internal auto-resume counter (leave at 0 for a new crawl)"
        required: false
        default: "0"
        type: string
      max_continuations:
        description: "Safety limit for automatic five-hour continuation runs"
        required: false
        default: "200"
        type: string

permissions:
  contents: read
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.parse.outputs.sites }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse domain list
        id: parse
        env:
          DOMAINS_INPUT: ${{ inputs.domains }}
        run: python scripts/parse_domains.py

  crawl:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 340
    concurrency:
      group: full-crawl-${{ matrix.site.slug }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        site: ${{ fromJSON(needs.prepare.outputs.sites) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          for attempt in 1 2 3; do
            echo "Dependency installation attempt $attempt/3."
            if python -m pip install --upgrade pip \
              && pip install -r requirements.txt \
              && crawl4ai-setup; then
              exit 0
            fi
            echo "Dependency installation attempt $attempt failed; retrying in 20s."
            sleep 20
          done
          exit 1

      - name: Recover from dependency/artifact failure
        if: ${{ failure() && inputs.auto_resume && inputs.resume_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_DOMAIN: ${{ matrix.site.domain }}
          MAX_PAGES: ${{ inputs.max_pages }}
          MAX_RUNTIME_MINUTES: ${{ inputs.max_runtime_minutes }}
          FULL_PAGE_SCAN: ${{ inputs.full_page_scan }}
          WRITE_RAW_LINKS: ${{ inputs.write_raw_links_to_sheets }}
          CONTINUATION_INDEX: ${{ inputs.continuation_index }}
          MAX_CONTINUATIONS: ${{ inputs.max_continuations }}
          PREVIOUS_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          echo "Pre-crawl infrastructure failure; re-queueing from checkpoint $PREVIOUS_RUN_ID."
          gh workflow run crawl-sites.yml \
            --ref "$GITHUB_REF_NAME" \
            --field domains="$TARGET_DOMAIN" \
            --field max_pages="$MAX_PAGES" \
            --field max_runtime_minutes="$MAX_RUNTIME_MINUTES" \
            --field full_page_scan="$FULL_PAGE_SCAN" \
            --field write_raw_links_to_sheets="$WRITE_RAW_LINKS" \
            --field max_parallel="1" \
            --field resume_run_id="$PREVIOUS_RUN_ID" \
            --field auto_resume="true" \
            --field continuation_index="$CONTINUATION_INDEX" \
            --field max_continuations="$MAX_CONTINUATIONS"
          echo "Recovery continuation queued."

      - name: Run tests
        run: pytest -q

      - name: Restore previous checkpoint/artifact
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: live-drop-hunter-${{ matrix.site.slug }}-${{ inputs.resume_run_id }}
          path: output
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.resume_run_id }}

      - name: Recover from artifact service failure
        if: ${{ failure() && inputs.auto_resume && inputs.resume_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_DOMAIN: ${{ matrix.site.domain }}
          MAX_PAGES: ${{ inputs.max_pages }}
          MAX_RUNTIME_MINUTES: ${{ inputs.max_runtime_minutes }}
          FULL_PAGE_SCAN: ${{ inputs.full_page_scan }}
          WRITE_RAW_LINKS: ${{ inputs.write_raw_links_to_sheets }}
          CONTINUATION_INDEX: ${{ inputs.continuation_index }}
          MAX_CONTINUATIONS: ${{ inputs.max_continuations }}
          PREVIOUS_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          echo "Artifact service failure; re-queueing from checkpoint $PREVIOUS_RUN_ID."
          gh workflow run crawl-sites.yml \
            --ref "$GITHUB_REF_NAME" \
            --field domains="$TARGET_DOMAIN" \
            --field max_pages="$MAX_PAGES" \
            --field max_runtime_minutes="$MAX_RUNTIME_MINUTES" \
            --field full_page_scan="$FULL_PAGE_SCAN" \
            --field write_raw_links_to_sheets="$WRITE_RAW_LINKS" \
            --field max_parallel="1" \
            --field resume_run_id="$PREVIOUS_RUN_ID" \
            --field auto_resume="true" \
            --field continuation_index="$CONTINUATION_INDEX" \
            --field max_continuations="$MAX_CONTINUATIONS"
          echo "Recovery continuation queued."

      - name: Crawl site
        id: crawl
        env:
          TARGET_DOMAIN: ${{ matrix.site.domain }}
          TARGET_SLUG: ${{ matrix.site.slug }}
          MAX_PAGES: ${{ inputs.max_pages }}
          MAX_RUNTIME_MINUTES: ${{ inputs.max_runtime_minutes }}
          FULL_PAGE_SCAN: ${{ inputs.full_page_scan }}
          WRITE_RAW_LINKS: ${{ inputs.write_raw_links_to_sheets }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          JOB_INDEX: ${{ strategy.job-index }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          args=(
            "$TARGET_DOMAIN"
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$JOB_INDEX-$TARGET_SLUG"
            --max-pages "$MAX_PAGES"
            --max-runtime-minutes "$MAX_RUNTIME_MINUTES"
          )
          if [ "$FULL_PAGE_SCAN" = "true" ]; then
            args+=(--full-page-scan)
          fi
          if [ "$WRITE_RAW_LINKS" = "true" ]; then
            args+=(--write-raw-links-to-sheets)
          fi
          if [ -n "$RESUME_RUN_ID" ]; then
            args+=(--resume)
          fi
          python main.py "${args[@]}"

      - name: Inspect crawl completion state
        id: crawl_state
        if: always()
        env:
          TARGET_SLUG: ${{ matrix.site.slug }}
        run: |
          stats_file="output/$TARGET_SLUG/stats.json"
          checkpoint_file="output/$TARGET_SLUG/crawl_checkpoint.json"
          if [ ! -f "$stats_file" ] && [ ! -f "$checkpoint_file" ]; then
            echo "state_found=false" >> "$GITHUB_OUTPUT"
            echo "crawl_complete=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Crawl stats were not produced; automatic continuation is disabled."
            exit 0
          fi
          stats_complete=false
          if [ -f "$stats_file" ]; then
            stats_complete=$(jq -r '.crawl_complete == true' "$stats_file")
          fi
          if [ "$stats_complete" != "true" ] && [ ! -f "$checkpoint_file" ]; then
            echo "state_found=false" >> "$GITHUB_OUTPUT"
            echo "crawl_complete=false" >> "$GITHUB_OUTPUT"
            echo "::warning::An incomplete crawl has no checkpoint; automatic continuation is disabled."
            exit 0
          fi
          echo "state_found=true" >> "$GITHUB_OUTPUT"
          checkpoint_pending=0
          if [ -f "$checkpoint_file" ]; then
            checkpoint_pending=$(jq -r '((.pending_urls // []) | length) + ((.deferred_urls // []) | length)' "$checkpoint_file")
          fi
          if [ "$stats_complete" = "true" ] || { [ -f "$checkpoint_file" ] && [ "$checkpoint_pending" -eq 0 ]; }; then
            echo "crawl_complete=true" >> "$GITHUB_OUTPUT"
            echo "remaining_queue_urls=0" >> "$GITHUB_OUTPUT"
          else
            echo "crawl_complete=false" >> "$GITHUB_OUTPUT"
            echo "remaining_queue_urls=$checkpoint_pending" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload reports/checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-drop-hunter-${{ matrix.site.slug }}-${{ github.run_id }}
          path: output/**
          if-no-files-found: warn
          retention-days: 30

      - name: Start next checkpointed continuation
        if: >-
          ${{ always()
              && inputs.auto_resume
              && inputs.max_pages == '0'
              && (steps.crawl.outcome == 'success' || steps.crawl.outcome == 'cancelled')
              && steps.crawl_state.outputs.state_found == 'true'
              && steps.crawl_state.outputs.crawl_complete != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_DOMAIN: ${{ matrix.site.domain }}
          TARGET_SLUG: ${{ matrix.site.slug }}
          MAX_PAGES: ${{ inputs.max_pages }}
          MAX_RUNTIME_MINUTES: ${{ inputs.max_runtime_minutes }}
          FULL_PAGE_SCAN: ${{ inputs.full_page_scan }}
          WRITE_RAW_LINKS: ${{ inputs.write_raw_links_to_sheets }}
          CONTINUATION_INDEX: ${{ inputs.continuation_index }}
          MAX_CONTINUATIONS: ${{ inputs.max_continuations }}
        run: |
          if ! [[ "$CONTINUATION_INDEX" =~ ^[0-9]+$ && "$MAX_CONTINUATIONS" =~ ^[0-9]+$ ]]; then
            echo "::error::Continuation counters must be non-negative integers."
            exit 1
          fi
          next_index=$((CONTINUATION_INDEX + 1))
          if (( next_index > MAX_CONTINUATIONS )); then
            echo "::error::Automatic continuation safety limit reached with ${{ steps.crawl_state.outputs.remaining_queue_urls }} URLs still queued."
            exit 1
          fi
          checkpoint_file="output/$TARGET_SLUG/crawl_checkpoint.json"
          if [ -f "$checkpoint_file" ]; then
          wait_seconds=$(python - "$checkpoint_file" <<'PY'
          import json
          import math
          import sys
          import time

          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  not_before = float(json.load(handle).get("host_not_before", 0) or 0)
          except (OSError, ValueError, TypeError):
              not_before = 0
          print(max(0, math.ceil(not_before - time.time())))
          PY
            )
            if (( wait_seconds > 0 )); then
              echo "Retry-After is active; waiting ${wait_seconds}s before queuing continuation."
              sleep "$wait_seconds"
            fi
          fi
          gh workflow run crawl-sites.yml \
            --ref "$GITHUB_REF_NAME" \
            --field domains="$TARGET_DOMAIN" \
            --field max_pages="$MAX_PAGES" \
            --field max_runtime_minutes="$MAX_RUNTIME_MINUTES" \
            --field full_page_scan="$FULL_PAGE_SCAN" \
            --field write_raw_links_to_sheets="$WRITE_RAW_LINKS" \
            --field max_parallel="1" \
            --field resume_run_id="$GITHUB_RUN_ID" \
            --field auto_resume="true" \
            --field continuation_index="$next_index" \
            --field max_continuations="$MAX_CONTINUATIONS"
          echo "Queued continuation $next_index/$MAX_CONTINUATIONS from run $GITHUB_RUN_ID."

      - name: Crash notification
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_DOMAIN: ${{ matrix.site.domain }}
        run: |
          python - <<'PY'
          import asyncio
          import os
          from drop_hunter.notifier import telegram_send_message

          asyncio.run(telegram_send_message(
              os.getenv("TELEGRAM_BOT_TOKEN", ""),
              os.getenv("TELEGRAM_CHAT_ID", ""),
              "❌ Crawl job crashed\n"
              + os.getenv("TARGET_DOMAIN", "")
              + "\nCheckpoint/artifact may still be available.",
          ))
          PY
